<!doctype html>
<!-- One-time setup (design 3.15.10): the EXTENSION's own microphone permission, needed only to read the
     names of the Chromebook's audio outputs (e.g. a Bluetooth Nest Mini). Nothing is recorded. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Chrome 遥控 · 声音输出设置</title>
    <style>
      :root { --bg: #121212; --surface: #1e1e1e; --accent: #ff7a00; --text: #ededed; --dim: #9e9e9e; --ok: #4caf50; --danger: #e5484d; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 24px/1.5 system-ui, "Noto Sans SC", sans-serif; }
      main { max-width: 760px; padding: 48px; background: var(--surface); border-radius: 16px; }
      h1 { margin: 0 0 16px; font-size: 36px; }
      p { margin: 12px 0; color: var(--dim); }
      #status { color: var(--text); font-weight: 600; }
      #status.ok { color: var(--ok); }
      #status.fail { color: var(--danger); }
      button { margin-top: 20px; min-height: 56px; padding: 0 28px; border: 0; border-radius: 12px; background: var(--accent); color: #000; font: inherit; font-weight: 700; cursor: pointer; }
      button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>允许读取声音输出设备</h1>
      <p>用手机把电视上的声音送到 Nest 等音箱，需要扩展知道这台 Chromebook 有哪些声音输出。</p>
      <p>请在 Chrome 弹出的询问里点 <b>允许</b>（用 Chromebook 的触控板、触摸屏或鼠标）。只给“Chrome 遥控”扩展，不会录音，视频网站拿不到这个权限。</p>
      <p id="status">正在等待你的选择…</p>
      <button id="retry" hidden>再试一次</button>
    </main>
    <script src="lib/protocol.js"></script>
    <script src="lib/log.js"></script>
    <script src="audio-setup.js"></script>
  </body>
</html>
