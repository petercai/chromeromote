<!doctype html>
<!--
  GitHub Pages serves this file for every 404 under the site.
  Main job: repair pairing links whose "#" was percent-encoded by a scanner app
  (…/remote/%23peer=…&key=… -> …/remote/#peer=…&key=…). Otherwise show a helpful page.
  Paths are resolved at runtime because a 404 can happen at any depth.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome 遥控 · 页面不存在</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #121212; color: #ededed; font: 16px/1.5 system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; }
      a { color: #ff7a00; }
      .dim { color: #9e9e9e; font-size: 14px; }
      code { word-break: break-all; font-size: 12px; color: #9e9e9e; }
    </style>
  </head>
  <body>
    <main>
      <h2 id="title">页面不存在(404)</h2>
      <p class="dim">打开的地址:<br /><code id="addr"></code></p>
      <p>遥控网页的地址是:<a id="remoteLink" href="#">remote/</a></p>
      <p class="dim">如果你刚推送代码,GitHub Pages 需要几分钟才能更新。<br />版本 <span id="ver">—</span></p>
    </main>
    <script>
      (function () {
        'use strict';
        var path = location.pathname;
        // Site root = everything before "/remote/" (project sites: "/<repo>/"), else the first segment.
        var idx = path.indexOf('/remote/');
        var root = idx >= 0 ? path.slice(0, idx + 1) : (path.match(/^\/[^/]+\//) || ['/'])[0];
        var remoteUrl = location.origin + root + 'remote/';
        document.getElementById('addr').textContent = location.href;
        document.getElementById('remoteLink').href = remoteUrl;
        document.getElementById('remoteLink').textContent = remoteUrl;

        var load = function (src, onload) {
          var s = document.createElement('script');
          s.src = root + src + '?t=' + Date.now(); // never serve a cached copy on this rescue page
          s.onload = onload;
          document.head.appendChild(s);
        };

        // Shared repair logic lives in protocol.js (one implementation, unit-tested).
        load('extension/lib/protocol.js', function () {
          var fixed = window.CR && window.CR.repairPairUrl(location.href);
          if (!fixed) return;
          console.log(JSON.stringify({ component: '404', event: 'pair_url.repaired', from: location.pathname }));
          document.getElementById('title').textContent = '正在打开遥控网页…';
          location.replace(fixed);
        });
        load('extension/lib/version.js', function () {
          document.getElementById('ver').textContent = window.CR_VERSION || '—';
        });
      })();
    </script>
  </body>
</html>
