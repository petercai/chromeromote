<!doctype html>
<!--
  GitHub Pages serves this file for every 404 under the site.
  1) If the opened address contains a pairing (peer + key) in ANY mangled form, redirect to the
     remote page with a clean "?t=<fresh>#peer=…&key=…" link (a fresh ?t forces a real page load).
  2) Otherwise show diagnostics: the exact address the phone opened (copyable) and the version,
     so an uncovered case can be reported and fixed.
  Paths are resolved at runtime because a 404 can happen at any depth.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome 遥控 · 页面不存在</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #121212; color: #ededed; font: 16px/1.5 system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 440px; width: 100%; }
      a { color: #ff7a00; word-break: break-all; }
      .dim { color: #9e9e9e; font-size: 14px; }
      .addr { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px;
              font: 13px/1.4 ui-monospace, monospace; word-break: break-all; color: #ededed; }
      button { margin-top: 8px; min-height: 48px; width: 100%; border: 0; border-radius: 12px;
               background: #1e1e1e; color: #ededed; font-size: 16px; }
      button.primary { background: #ff7a00; color: #000; }
    </style>
  </head>
  <body>
    <main>
      <h2 id="title">页面不存在(404)</h2>
      <p class="dim">手机打开的地址(把它复制发给开发者,可以帮助定位问题):</p>
      <div id="addr" class="addr"></div>
      <button id="copy">复制地址</button>
      <p id="hint" class="dim">这个地址里没有找到配对信息。请<b>关闭这个标签页</b>,在 Chromebook 上重新打开扩展弹窗,再扫一次新的二维码。</p>
      <button id="open" class="primary">打开遥控网页</button>
      <p class="dim">版本 <span id="ver">—</span></p>
    </main>
    <script>
      (function () {
        'use strict';
        var path = location.pathname;
        // Site root = everything before "/remote" (project sites: "/<repo>/"), else the first segment.
        var idx = path.search(/\/remote(\/|%2F|$)/i);
        var root = idx >= 0 ? path.slice(0, idx + 1) : (path.match(/^\/[^/]+\//) || ['/'])[0];
        var remoteUrl = location.origin + root + 'remote/';
        document.getElementById('addr').textContent = location.href;
        document.getElementById('open').onclick = function () { location.href = remoteUrl + '?t=' + Date.now().toString(36); };
        document.getElementById('copy').onclick = function () {
          navigator.clipboard.writeText(location.href).then(function () {
            document.getElementById('copy').textContent = '已复制';
          });
        };

        var load = function (src, onload) {
          var s = document.createElement('script');
          s.src = root + src + '?t=' + Date.now(); // never serve a cached copy on this rescue page
          s.onload = onload;
          document.head.appendChild(s);
        };

        // Shared recovery logic lives in protocol.js (one implementation, unit-tested).
        load('extension/lib/protocol.js', function () {
          var pairing = window.CR && window.CR.extractPairing(location.href);
          console.log(JSON.stringify({ component: '404', event: 'not_found', href: location.href, pairing_found: Boolean(pairing) }));
          if (!pairing) return;
          document.getElementById('title').textContent = '正在打开遥控网页…';
          document.getElementById('hint').textContent = '';
          location.replace(remoteUrl + '?t=' + Date.now().toString(36) +
            '#peer=' + encodeURIComponent(pairing.peerId) + '&key=' + encodeURIComponent(pairing.key));
        });
        load('extension/lib/version.js', function () {
          document.getElementById('ver').textContent = window.CR_VERSION || '—';
        });
      })();
    </script>
  </body>
</html>
